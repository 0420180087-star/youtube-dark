name: Auto Post Video

concurrency:
  group: darkstream-auto-post
  cancel-in-progress: false

on:
  schedule:
    # Runs every 15 minutes — checks queued/due projects without requiring the page to stay open
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      project_id:
        description: 'ID do projeto para forçar execução (opcional)'
        required: false

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # alinhado ao orçamento do runner (JOB_BUDGET_MINUTES=80)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'    # Node 22 tem WebSocket nativo — resolve o erro do @supabase/realtime-js
          cache: 'npm'

      - name: Instalar FFmpeg
        run: |
          # A imagem ubuntu-latest já vem com repositórios da Microsoft
          # (azure-cli, dotnet) que não usamos aqui. Quando eles respondem
          # 403 (aconteceu em 12/08), o "apt-get update" falha por inteiro
          # mesmo os repositórios do Ubuntu tendo baixado certinho — e o
          # ffmpeg nunca chega a ser instalado. Removendo-os antes evita
          # que uma instabilidade da Microsoft derrube esse passo.
          sudo grep -rl "packages.microsoft.com" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verificar FFmpeg
        run: ffmpeg -version

      - name: Instalar dependências
        # npm ci garante exatamente as versões testadas. Se o lockfile estiver
        # divergente do package.json, cai para npm install em vez de falhar.
        run: npm ci || npm install


      - name: Executar pipeline de automação
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.VITE_PEXELS_API_KEY }}
          VITE_PEXELS_API_KEY: ${{ secrets.VITE_PEXELS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          PROJECT_ID: ${{ github.event.inputs.project_id }}
        # tsx executa o runner com suporte a TypeScript — necessário desde a
        # Fase 2, quando o runner passou a importar src/services/*.ts
        # diretamente (mesma lógica de visuais do app, sem duplicar código).
        run: npx tsx scripts/automation-runner.js
